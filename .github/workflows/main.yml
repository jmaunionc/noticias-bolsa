name: Escáner Diario de Noticias Financieras

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 07:00 AM UTC (ajusta la hora si lo prefieres)
    - cron: '0 7 * * 1-5'
  # Permite ejecutarlo manualmente desde la pestaña Actions cuando quieras probarlo
  workflow_dispatch:

jobs:
  ejecutar-escaner:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    - name: Ejecutar script de rastreo
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python script.py
